# Gestos → comandos. Copiado para ~/.config/gestos/gestos.toml na instalação;
# edite lá. Reinicie com Super+Ctrl+G duas vezes para aplicar.
#
# Motor "poses": MediaPipe acha a mão e um classificador treinado com as SUAS
# mãos diz a pose (gestos-treinar gravar / gestos-treinar). Cada pose segurada
# vira um evento: "segurar" = segundos até disparar; "repetir" = repete a cada
# X s enquanto segura (0 = uma vez só).
#
# Poses treinadas: like dislike one one_down point_right point_left peace ok
# palm fist (palm e fist = descanso) e "nada" (mão à toa, nunca dispara).
#
# Outros motores: gestos-hagrid.toml (modelo pronto do HaGRID) e
# gestos-mediapipe.toml (regras antigas: pinça, maçaneta, giro).

[motor]
tipo = "poses"
confianca_min = 0.8     # palpites do classificador abaixo disso são ignorados
quadros_estaveis = 4    # quadros seguidos com a mesma pose para valer

[camera]
dispositivo = 0
largura = 640
altura = 480

[ajustes]
notificar = true

# 👍 liga/desliga o ditado por voz (voxtype): um 👍 começa a gravar, fale,
# outro 👍 para e digita o texto na janela em foco.
[gestos.like]
rotulo = "👍 ditado (voxtype)"
comando = "voxtype record toggle"
segurar = 0.6

[gestos.dislike]
rotulo = "👎 volume −"
comando = "omarchy-audio-output-volume -5"
segurar = 0.5
repetir = 0.3

[gestos.one]
rotulo = "☝ rolando ↑"
comando = "~/.local/bin/gestos-rolar -15"
segurar = 0.3
repetir = 0.1

[gestos.one_down]
rotulo = "👇 rolando ↓"
comando = "~/.local/bin/gestos-rolar 15"
segurar = 0.3
repetir = 0.1

[gestos.point_right]
rotulo = "👉 janela da direita"
comando = "hyprctl dispatch 'hl.dsp.focus({ direction = \"r\" })'"
segurar = 0.5
repetir = 1.0

[gestos.point_left]
rotulo = "👈 janela da esquerda"
comando = "hyprctl dispatch 'hl.dsp.focus({ direction = \"l\" })'"
segurar = 0.5
repetir = 1.0

[gestos.peace]
rotulo = "✌ play/pause"
comando = "omarchy-shell media playPause"
segurar = 0.8

[gestos.ok]
rotulo = "👌 menu"
comando = "omarchy-menu toggle"
segurar = 0.8

# ✋→✊ Agarrar e arrastar a janela ativa: abra a mão e feche (como pegar algo);
# a janela vira flutuante e segue a mão; abra a mão para soltar.
# Apague esta seção para desligar.
[arrastar_janela]
pose = "fist"
segurar = 0.25      # segundos de punho para agarrar
aberta_antes = 1.0  # a mão precisa ter estado aberta até X s antes de fechar
ganho = 1.5         # 1 = a janela anda o mesmo que a mão na imagem; maior = mais rápido
