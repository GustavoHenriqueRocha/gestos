# Gestos → comandos. Copiado para ~/.config/gestos/gestos.toml na instalação;
# edite lá. Reinicie com Super+Ctrl+G duas vezes para aplicar.
#
# Motor "hagrid": modelos treinados do HaGRID (ai-forever/dynamic_gestures).
# Dois tipos de gesto:
#  - POSE segurada: o nome é a pose (lista abaixo). "segurar" = segundos até
#    disparar; "repetir" = repete a cada X s enquanto segura (0 = uma vez só).
#  - Gesto DINÂMICO: swipe_esquerda, swipe_direita, swipe_cima, swipe_baixo,
#    swipe_rapido_cima, swipe_rapido_baixo, zoom_mais, zoom_menos, toque,
#    toque_duplo, arrastar, soltar.
#
# Poses que o modelo conhece: like dislike ok peace peace_inverted palm stop
# stop_inverted fist fist_inverted one one_down one_left one_right point
# two_up two_up_inverted two_left two_right two_down three three2 three3
# three_gun four rock call mute little_finger middle_finger grip grabbing
# thumb_index thumb_left thumb_right thumb_down hand_down hand_left hand_right
# half_up half_down half_left half_right part_hand_heart part_hand_heart2
#
# Para voltar ao motor antigo (MediaPipe + regras), use gestos-mediapipe.toml.

[motor]
tipo = "hagrid"
confianca_min = 0.6     # palpites do modelo abaixo disso são ignorados
quadros_estaveis = 4    # quadros seguidos com a mesma pose para valer

[camera]
dispositivo = 0
largura = 640
altura = 480

[ajustes]
notificar = true

# 👍 / 👎 segurando: volume sobe / desce enquanto segura
[gestos.like]
rotulo = "👍 volume +"
comando = "omarchy-audio-output-volume +5"
segurar = 0.5
repetir = 0.3

[gestos.dislike]
rotulo = "👎 volume −"
comando = "omarchy-audio-output-volume -5"
segurar = 0.5
repetir = 0.3

# ☝ / 👇 segurando: rola a janela ativa para cima / baixo enquanto segura
[gestos.one]
rotulo = "☝ rolando ↑"
comando = "~/.local/bin/gestos-rolar -15"
segurar = 0.3
repetir = 0.1

[gestos.one_down]
rotulo = "👇 rolando ↓"
comando = "~/.local/bin/gestos-rolar 15"
segurar = 0.3
repetir = 0.1

# Mão de lado varrendo (como no celular): da direita para a esquerda = vai
# para a janela da DIREITA. Troque os comandos se preferir o contrário.
[gestos.swipe_esquerda]
rotulo = "👋 → janela da direita"
comando = "hyprctl dispatch 'hl.dsp.focus({ direction = \"r\" })'"

[gestos.swipe_direita]
rotulo = "👋 ← janela da esquerda"
comando = "hyprctl dispatch 'hl.dsp.focus({ direction = \"l\" })'"

# ✌ segurando: play/pause
[gestos.peace]
rotulo = "✌ play/pause"
comando = "omarchy-shell media playPause"
segurar = 0.8

# 👌 segurando: menu do Omarchy
[gestos.ok]
rotulo = "👌 menu"
comando = "omarchy-menu toggle"
segurar = 0.8

