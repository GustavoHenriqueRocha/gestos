# Gestos → comandos. Copiado para ~/.config/gestos/gestos.toml na instalação;
# edite lá. O serviço relê o arquivo ao reiniciar (Super+Ctrl+G duas vezes).
#
# Cada gesto tem um comando de shell e um rótulo opcional mostrado na
# notificação. Apague ou comente um gesto para desativá-lo.

[camera]
dispositivo = 0
largura = 640
altura = 480

[ajustes]
notificar = true
swipe_distancia = 0.25  # quanto a mão precisa andar (fração da largura da imagem)
segurar = 0.8           # segundos parado para mão aberta / joinha / punho
pinca_janela = 1.0      # segundos para ir de pinça fechada (pontas encostadas) a aberta ("L") e vice-versa
rolar_zona_morta = 0.04 # quanto subir/descer a mão (dois dedos) antes de começar a rolar
rolar_velocidade = 4.5 # mais alto = rola mais rápido
pinca_repetir = 0.4     # segurando a pinça na posição final, repete o passo a cada X s (0 desliga)

# Mão aberta girando como maçaneta: horário = aba/janela da direita
[gestos.macaneta_horario]
rotulo = "🔄 → Janela da direita"
comando = "hyprctl dispatch 'hl.dsp.focus({ direction = \"r\" })'"

[gestos.macaneta_anti_horario]
rotulo = "🔄 ← Janela da esquerda"
comando = "hyprctl dispatch 'hl.dsp.focus({ direction = \"l\" })'"

# Dois dedos girando em círculo: rolagem contínua
[gestos.giro_horario]
rotulo = "🌀 rolando ↓"
comando = "~/.local/bin/gestos-rolar 15"

[gestos.giro_anti_horario]
rotulo = "🌀 rolando ↑"
comando = "~/.local/bin/gestos-rolar -15"

# Swipes laterais desligados (a maçaneta faz a troca); descomente para usar
# [gestos.swipe_esquerda]
# rotulo = "✌ ← Janela da esquerda"
# comando = "hyprctl dispatch 'hl.dsp.focus({ direction = \"l\" })'"
#
# [gestos.swipe_direita]
# rotulo = "✌ → Janela da direita"
# comando = "hyprctl dispatch 'hl.dsp.focus({ direction = \"r\" })'"

[gestos.rolar_cima]
rotulo = "✌ rolando ↑"
comando = "~/.local/bin/gestos-rolar -15"

[gestos.rolar_baixo]
rotulo = "✌ rolando ↓"
comando = "~/.local/bin/gestos-rolar 15"

# Swipes verticais livres (a rolagem usa o movimento vertical dos dois dedos)
# [gestos.swipe_cima]
# rotulo = "✌ ↑ Tela cheia"
# comando = "hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = \"fullscreen\" })'"
#
# [gestos.swipe_baixo]
# rotulo = "✌ ↓ Scratchpad"
# comando = "hyprctl dispatch 'hl.dsp.workspace.toggle_special(\"scratchpad\")'"

[gestos.pinca_abrir]
rotulo = "🤏 volume +"
comando = "omarchy-audio-output-volume +10"

[gestos.pinca_fechar]
rotulo = "🤏 volume −"
comando = "omarchy-audio-output-volume -10"

[gestos.mao_aberta]
rotulo = "✋ Menu do Omarchy"
comando = "omarchy-menu toggle"

[gestos.joinha]
rotulo = "👍 Play/Pause"
comando = "omarchy-shell media playPause"

